<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online C Editor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; }
    #inputArea { height: 80px; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; }
    pre { background: #222; color: #0f0; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Online C Compiler (JSP + GCC)</h1>
  
  <label>Write C Code:</label>
  <textarea id="codeArea">#include &lt;stdio.h&gt;

int main() {
    int a, b;
    scanf("%d %d", &a, &b);
    printf("Sum = %d\n", a + b);
    return 0;
}</textarea>

  <label>Input:</label>
  <textarea id="inputArea">5 7</textarea>

  <button onclick="runCode()">Run Code</button>

  <h2>Output:</h2>
  <pre id="outputArea"></pre>

  <script>
    function runCode() {
      const code = document.getElementById("codeArea").value;
      const input = document.getElementById("inputArea").value;

      fetch("onlineEditor.jsp", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "code=" + encodeURIComponent(code) + "&input=" + encodeURIComponent(input)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("outputArea").textContent =
          data.output ? data.output : (data.error || "Unknown error");
      })
      .catch(err => {
        document.getElementById("outputArea").textContent = "Request failed: " + err;
      });
    }
  </script>
</body>
</html>

</html>
